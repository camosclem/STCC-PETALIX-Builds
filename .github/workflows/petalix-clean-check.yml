# Isolated development check only. Never signs or publishes customer updates.
name: Petalix clean 11.1 staging verification

on:
  push:
    branches: [staging/petalix-clean-11-1]
    paths:
      - tooling/petalix-clean/**
      - .github/workflows/petalix-clean-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Petalix build repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private-playlist organizer using only synthetic streams
        run: python3 -m unittest discover -v -s tooling/petalix-clean -p test_organize_playlist.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android tooling
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Checkout upstream exact release source
        run: |
          git clone --quiet --filter=blob:none --depth=1 --branch=1.1.0-beta.11.1 \
            https://github.com/homelessbrian/NuvioPlusIPTV.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "a7e67cec36e1e28d79b889b5630c4b2095931888"
      - name: Minimal Petalix branding patch and fingerprint check
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tooling/petalix-clean/prepare_stock.py \
            --upstream upstream \
            --logo tooling/android-build/petalix_metallic_logo.png
      - name: Build non-deployable debug test APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --stacktrace
      - name: Validate package identity and new version
        run: |
          set -euo pipefail
          APK="$(find upstream/app/build/outputs/apk/full/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/petalix-badging
          grep -F "name='com.petalix.iptv.preview'" /tmp/petalix-badging
          grep -F "versionCode='1794250000'" /tmp/petalix-badging
          echo "PASS: Petalix stock-based DEBUG test build produced."
          echo "NOT CUSTOMER READY: debug signer; no panel PIN migration."
      - name: Retain only debug test APK for manual inspection
        uses: actions/upload-artifact@v4
        with:
          name: Petalix-clean-11.1-DEBUG-NOT-CUSTOMER-UPDATE
          path: upstream/app/build/outputs/apk/full/debug/*.apk
          retention-days: 3
          if-no-files-found: error
