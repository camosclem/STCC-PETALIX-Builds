name: Petalix IMD preview APK
on:
  push:
    branches: [dev/petalix-imd-preview]
    paths: [imd-rebrand/**, .github/workflows/petalix-imd-preview.yml]
permissions:
  contents: write
concurrency:
  group: petalix-imd-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare source
        run: |
          git clone --depth 1 --branch v0.5.2 https://github.com/majorleeevil/imd-tv.git source
          test "$(git -C source rev-parse HEAD)" = 369d43e05ba9de7e5b61fb0621fb7f2bf7558da8
          git -C source apply --whitespace=error "$GITHUB_WORKSPACE/imd-rebrand/petalix.patch"
          cp -a imd-rebrand/res/. source/app/src/main/res/
          cp imd-rebrand/README.md source/PETALIX.md
          git -C source add .
          git -C source -c user.name='Petalix build' -c user.email='actions@users.noreply.github.com' commit -m 'Apply Petalix preview branding'
          git -C source archive --format=zip --prefix=Petalix-IMD-Source/ HEAD > Petalix-IMD-Source.zip
      - name: Compile APK
        working-directory: source
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease
      - name: Verify Android TV APK
        run: |
          cp source/app/build/outputs/apk/release/app-release.apk Petalix-IMD-Preview.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose Petalix-IMD-Preview.apk
          "$tools/aapt" dump badging Petalix-IMD-Preview.apk > badging.txt
          grep -F "package: name='com.petalix.imdpreview'" badging.txt
          grep -F "application-label:'Petalix'" badging.txt
          grep -F "leanback-launchable-activity:" badging.txt
          sha256sum Petalix-IMD-Preview.apk Petalix-IMD-Source.zip > SHA256SUMS.txt
      - name: Publish standalone preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "petalix-imd-preview-$GITHUB_RUN_ID" Petalix-IMD-Preview.apk Petalix-IMD-Source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "Petalix IMD Preview" \
            --notes "Petalix preview based on IMD TV v0.5.2 by majorleeevil. Starts with Celestial Glass in Dark Mode. Installs alongside existing apps and uses its own playlist setup. Corresponding GPL-3.0 source is attached."
