name: Verify Petalix v0.5.1 startup and publish APK
on:
  push:
    branches: [test/petalix-v05-startup]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon assembleDebug
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/check-launch.sh
      - name: Save screenshot and crash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petalix-v051-launch-diagnostics
          path: |
            startup-log.txt
            activity-state.txt
            launch.png
          if-no-files-found: ignore
      - name: Publish verified APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Petalix_TV_PIN_Beta_v0.5.1.apk
          gh release create petalix-pin-beta-v0.5.1 Petalix_TV_PIN_Beta_v0.5.1.apk --title "Petalix TV Beta v0.5.1 — Startup Crash Fix" --notes "Fixes WebView cleanup crash when redirecting to the initial PIN activation screen. Verified on Android emulator. The separate control-panel backend is not deployed; beta preview mode works without activation." --target test/petalix-v05-startup --prerelease
