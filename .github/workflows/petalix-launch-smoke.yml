name: Diagnose Petalix TV v0.5 launch
on:
  push:
    branches: [test/petalix-v05-startup]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon assembleDebug
      - name: Launch on Android emulator and capture crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.petalix.tv.guidebeta/com.openguide.tv.MainActivity
            sleep 9
            adb logcat -d -v threadtime > startup-log.txt
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|mFocusedApp' > activity-state.txt || true
            if grep -q 'FATAL EXCEPTION' startup-log.txt; then
              grep -A 50 -B 3 'FATAL EXCEPTION' startup-log.txt | tail -n 100
              exit 1
            fi
            echo "No fatal exception found."
            cat activity-state.txt
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petalix-startup-log
          path: |
            startup-log.txt
            activity-state.txt
          if-no-files-found: ignore
