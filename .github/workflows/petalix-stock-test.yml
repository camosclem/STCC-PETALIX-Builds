name: Petalix 13.1 — Restore 8.3 Home and services
on:
  push:
    branches: [test/petalix-stock-13-1-20261109]
    paths: [.github/workflows/petalix-stock-test.yml, tooling/petalix-stock/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: petalix-home-services-13-1
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[stock-assets-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Android tools and branding dependency
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          python3 -m pip install --disable-pip-version-check Pillow
      - name: Pinned Nuvio + IPTV 13.1
        run: |
          git clone --quiet --depth 1 --branch 1.1.0-beta.13.1 https://github.com/homelessbrian/NuvioPlusIPTV.git upstream
          test "$(git -C upstream rev-parse HEAD)" = c0c9e8a2bf8bf0de8645438f9365d37c97da9f6e
          python3 tooling/petalix-stock/prepare.py --upstream upstream --version 1794254001
      - name: Compile separate native test APK
        working-directory: upstream
        env:
          GOPROXY: https://proxy.golang.org|direct
          GODEBUG: http2client=0
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=1024m' --stacktrace
      - name: Verify compiled identity and publish test only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          apk=$(find upstream/app/build/outputs/apk/full/debug -name '*universal*.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then apk=$(find upstream/app/build/outputs/apk/full/debug -name '*.apk' -type f | head -n 1); fi
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/petalix-identity.txt
          grep -F "name='com.petalix.iptv.hometest'" /tmp/petalix-identity.txt
          grep -F "versionCode='1794254001'" /tmp/petalix-identity.txt
          grep -F "application-label:'Petalix Home Test'" /tmp/petalix-identity.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > /tmp/petalix-current-cert.txt
          python3 - <<'PYCERT'
          import pathlib,re
          text=pathlib.Path('/tmp/petalix-current-cert.txt').read_text()
          match=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',text)
          assert match and match.group(1)=='e2c9a67239c6297fb28a28b72a088ad32cff8aeb94e0157b02d22ee7aeb5cbd8', 'Isolated test signing certificate changed'
          print('Verified reproducible Petalix Home Test signing identity.')
          PYCERT
          cp "$apk" release/Petalix-13.1-Home-Services-Test.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('upstream')
          catalog_path='assets/petalix/streaming-services.json'
          with zipfile.ZipFile('release/Petalix-13.1-Home-Services-Test.apk') as apk:
              assert apk.testzip() is None, 'APK archive is damaged'
              catalog=apk.read(catalog_path)
              assert catalog==(root/'app/src/main'/catalog_path).read_bytes(), 'APK catalog does not match source'
              document=json.loads(catalog)
              assert len(document)==1 and document[0]['id']=='collection-streaming-services-only'
              titles=[folder['title'] for folder in document[0]['folders']]
              assert titles==['Netflix','Prime Video','Disney+','Hulu','HBO Max','Apple TV+','Peacock','Paramount+','Tubi TV','Pluto TV','BritBox'], titles
              assert b'@panel_' not in catalog, 'Unresolved panel catalog placeholders'
              dex=b''.join(apk.read(name) for name in apk.namelist() if name.startswith('classes') and name.endswith('.dex'))
              for marker in [b'DistinctPetalixServiceScreen',b'PetalixServiceScreen',b'PetalixServiceDetails',b'nativeHomeServicesV3']:
                  assert marker in dex, 'Missing compiled restored service feature: '+marker.decode()
              bundle=json.loads(apk.read('assets/petalix2/service-media-bundle.json'))
              assert bundle['sourceArchiveSha256']=='88beb6fe08b948b3909c1cfe88e2474010738e715a75f0fb450bda862e8998f9'
              assert len(bundle['media'])==8 and len(bundle['logos'])==8
              verified_assets={}
              for entries in [bundle['media'],bundle['logos']]:
                  for name,entry in entries.items():
                      path='assets/'+entry['assetPath']
                      data=apk.read(path)
                      assert len(data)==entry['size'], 'Wrong original media size: '+name
                      assert hashlib.sha256(data).hexdigest()==entry['sha256'], 'Wrong original media digest: '+name
                      assert data==(root/'app/src/main'/path).read_bytes(), 'Media source/APK mismatch: '+name
                      verified_assets[path]=data
              assert all(entry['hasAudio'] for entry in bundle['media'].values())
              assert bundle['syntheticServiceSounds'] is False
          with zipfile.ZipFile('release/Petalix-13.1-Home-Services-Test-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  parts=p.relative_to(root).parts
                  if not p.is_file() or any(v in {'.git','.gradle','.kotlin','.cxx','build'} for v in parts) or p.name in {'local.properties','local.dev.properties'} or p.suffix in {'.jks','.keystore'}:continue
                  z.write(p,str(pathlib.Path('petalix-source')/p.relative_to(root)))
          with zipfile.ZipFile('release/Petalix-13.1-Home-Services-Test-Source.zip') as z:
              assert z.testzip() is None, 'Source archive is damaged'
              assert z.read('petalix-source/app/src/main/'+catalog_path)==catalog
              for path,data in verified_assets.items():
                  assert z.read('petalix-source/app/src/main/'+path)==data, 'Published source media mismatch'
              assert not any(pathlib.PurePosixPath(name).suffix in {'.jks','.keystore'} for name in z.namelist()), 'Signing key must not be published'
          print('Verified Petalix Home/services restoration: original per-service screens, Home startup, 11 services including BritBox, and matching source.')
          PY
          (cd release && sha256sum Petalix-13.1-Home-Services-Test.apk Petalix-13.1-Home-Services-Test-Source.zip > Petalix-13.1-Home-Services-Test.sha256)
          cat > /tmp/petalix-release-notes.md <<'EOF'
          Restores the horizontal Home service row and the distinct service interfaces from the latest Petalix 8.3 source, on pinned Nuvio + IPTV 1.1.0-beta.13.1.

          Services open directly from the Home row. The separate Streaming Services sidebar/page from the previous Test 2 build is removed. Original bundled service intro videos retain their sound and animation. Netflix, Prime Video, Disney+, Hulu, HBO Max, Apple TV+, Peacock, Paramount+, Tubi TV, Pluto TV and BritBox are included. Native Live TV, guide, Sports, player and settings remain available.

          Reference: Petalix 8.3 build 1793881218, source SHA-256 88beb6fe08b948b3909c1cfe88e2474010738e715a75f0fb450bda862e8998f9. The restored service layouts and detail screens are taken from that matching published source. Original video intros exist for eight services; other services retain their available artwork and focus animations.

          This installs separately as Petalix Home Test, package com.petalix.iptv.hometest, version code 1794254001. The earlier Test 2 build used a runner-generated debug signing key that was not persisted, so this is not an in-place Test 2 update. The new isolated package uses the fixed test signing key from the pinned upstream source; CI verifies its exact certificate digest so later Home Test builds can update it. It does not publish a customer update.

          Activate this separate test app with your Petalix PIN and an available test device slot. Existing apps and their activation remain installed.

          Metadata configuration comes from the existing authenticated panel connection. Provider credentials are not included. The public upstream test key is excluded from the source archive; rebuilders can obtain it from pinned upstream commit c0c9e8a2bf8bf0de8645438f9365d37c97da9f6e at keystore/livetv-fork.jks. Physical TV validation of remote navigation, sound and playback is still required. Matching source and SHA-256 checksums are included.
          EOF
          gh release create petalix-13.1-home-services-20261109 release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Petalix 13.1 — Restored Home and Services Test' --notes-file /tmp/petalix-release-notes.md --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Petalix-13.1-Home-Services-Test
          path: release/*
          if-no-files-found: ignore
          retention-days: 7
