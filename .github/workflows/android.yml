name: OpenGuide TV Android debug build
on:
  push:
    branches:
      - openguide-tv-beta
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload Shield-installable debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OpenGuide-TV-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
