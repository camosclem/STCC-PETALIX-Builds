name: Petalix TV Beta Android APK
on:
  push:
    branches:
      - openguide-tv-beta
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Petalix-TV-v0.5-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish Petalix 0.5 test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Petalix_TV_PIN_Beta_v0.5.apk
          if gh release view petalix-pin-beta-v0.5 >/dev/null 2>&1; then
            gh release upload petalix-pin-beta-v0.5 Petalix_TV_PIN_Beta_v0.5.apk --clobber
          else
            gh release create petalix-pin-beta-v0.5 Petalix_TV_PIN_Beta_v0.5.apk \
              --title "Petalix TV Beta v0.5 — PIN & Native Guide" \
              --notes "Separate beta. Server PIN needs a hosted Petalix Control BETA HTTPS endpoint. No production customers changed. Native PIN, guide preview, managed ZIP-to-market locals." \
              --target openguide-tv-beta --prerelease
          fi
