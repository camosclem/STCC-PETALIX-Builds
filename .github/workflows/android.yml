name: OpenGuide TV Android debug build
on:
  push:
    branches:
      - openguide-tv-beta
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload Shield-installable debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OpenGuide-TV-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct-download test APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OpenGuide_TV_Shield_Test.apk
          if gh release view openguide-tv-v0.1.0-beta >/dev/null 2>&1; then
            gh release upload openguide-tv-v0.1.0-beta OpenGuide_TV_Shield_Test.apk --clobber
          else
            gh release create openguide-tv-v0.1.0-beta OpenGuide_TV_Shield_Test.apk \
              --title "OpenGuide TV 0.1.0 Shield Test" \
              --notes "Standalone Android TV debug test build. M3U playlist import, XMLTV EPG, and Media3 player. Unverified on physical Shield. Not yet a visual Binged replica." \
              --target openguide-tv-beta --prerelease
          fi
