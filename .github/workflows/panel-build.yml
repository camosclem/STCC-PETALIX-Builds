name: STCC + Petalix panel builds
on:
  workflow_dispatch:
    inputs:
      rebuild_build:
        description: 'Rebuild a finished panel request with current app support (panel build ID)'
        required: false
        type: string
      recover_build:
        description: 'Recover an already published build without recompiling (panel build ID)'
        required: false
        type: string
      petalix_only:
        description: 'Build and publish only the signed Petalix UI2 test APK; STCC is deferred.'
        required: false
        default: false
        type: boolean
      ui2_test:
        description: 'Manual only: build Petalix 2 UI using approved original package and signing via a panel-authorized rebuild ID. Does NOT deploy to customers.'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: [.github/workflows/panel-build.yml, tooling/android-build/**]
  schedule:
    - cron: '3-59/5 * * * *'
concurrency:
  group: stcc-petalix-panel-build
  cancel-in-progress: false
permissions: {}
jobs:
  claim:
    if: inputs.recover_build == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      has_job: ${{ steps.claim.outputs.has_job }}
      job: ${{ steps.claim.outputs.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: claim
        env:
          REBUILD_BUILD_ID: ${{ inputs.rebuild_build }}
          PETALIX_UI2_TEST: ${{ inputs.ui2_test }}
        run: python3 tooling/android-build/runner.py claim
  sync-current:
    needs: claim
    if: needs.claim.outputs.has_job == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tooling/android-build/runner.py sync-current
  build:
    needs: claim
    if: needs.claim.outputs.has_job == 'true'
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(contains(needs.claim.outputs.job, 'petalix-native-panel-13-1-v1') && '["petalix"]' || inputs.petalix_only && '["petalix"]' || '["petalix","stcc"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      PANEL_JOB: ${{ needs.claim.outputs.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Petalix 2 full-screen UI source
        if: ${{ inputs.ui2_test && matrix.brand == 'petalix' }}
        uses: actions/checkout@v4
        with:
          repository: camosclem/STCC-PETALIX-Builds
          ref: 906bdb444b911b9f5eb105d4f9f9ae37839e1f2f
          path: ui2-sources
          persist-credentials: false
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Native service media dependencies
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Shared app defaults
        run: python3 tooling/android-build/runner.py defaults
      - name: Merge, test and build
        env:
          SERVICE_BRAND: ${{ matrix.brand }}
          PETALIX_UI2_TEST: ${{ inputs.ui2_test }}
        run: python3 tooling/android-build/build.py "$SERVICE_BRAND"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.brand }}
          path: out/*
          retention-days: 7
          if-no-files-found: error
  sign:
    needs: [claim, build]
    if: needs.claim.outputs.has_job == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-signing
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      PANEL_JOB: ${{ needs.claim.outputs.job }}
      GH_TOKEN: ${{ github.token }}
      PETALIX_UI2_TEST: ${{ inputs.ui2_test }}
      PETALIX_ONLY_TEST: ${{ inputs.petalix_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify, sign and prepare both releases
        run: python3 tooling/android-build/runner.py sign
  recover:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-signing
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVER_BUILD_ID: ${{ inputs.recover_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published APKs and restore panel registration
        run: python3 tooling/android-build/runner.py recover
  report-failure:
    needs: [claim, build, sign]
    if: always() && needs.claim.outputs.has_job == 'true' && (needs.build.result != 'success' || needs.sign.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      PANEL_JOB: ${{ needs.claim.outputs.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tooling/android-build/runner.py failed
