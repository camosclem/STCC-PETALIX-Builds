name: Petalix glass guide owner test
on:
  push:
    branches: [dev/petalix-glass-13-2]
    paths: ['.github/workflows/petalix-glass-13-2.yml', 'tooling/petalix-glass/**']
permissions:
  contents: read
concurrency:
  group: petalix-glass-owner-test
  cancel-in-progress: true
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned public launcher source
        run: |
          git clone --no-recurse-submodules --depth 1 --branch 1.1.0-beta.13.2 https://github.com/homelessbrian/NuvioPlusIPTV.git launcher
          test "$(git -C launcher rev-parse HEAD)" = '6e18ff250d93c0c1bac64bda75f49b035027ab99'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Android SDK and branding tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          python3 -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Verify offline service artwork
        run: python3 -m unittest discover -s tooling/petalix-stock -p 'test_service_artwork.py' -q
      - name: Apply the guide to the exact owner-test source
        id: prepare
        run: |
          VERSION=$(date +%s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 tooling/petalix-stock/prepare.py --upstream launcher --version "$VERSION" --owner-test
          python3 tooling/petalix-glass/prepare.py launcher
          mkdir -p out
          git -C launcher add -A
          SOURCE_TREE=$(git -C launcher write-tree)
          git -C launcher archive --format=tar.gz --prefix=Petalix-source/ --output="$GITHUB_WORKSPACE/out/Petalix-Guide-Source.tar.gz" "$SOURCE_TREE"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > launcher/local.properties
          cp launcher/keystore/livetv-fork.jks "$RUNNER_TEMP/petalix-launcher-test.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/petalix-launcher-test.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"
      - name: Check guide behavior, sports filters, source fallback and episode ratings
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testFullDebugUnitTest \
            --tests 'com.nuvio.tv.petalix.*' --tests 'com.nuvio.tv.ui.screens.home.PetalixCategoryHeroTest' \
            --tests 'com.nuvio.tv.livetv.sports.SportsWatchPolicyTest' --tests '*AutoPlaySourceFallbackTest' \
            --tests '*SourceFallbackHandoffTest' --tests '*EpisodeAutoPlayLoadingTest' --tests '*EpisodeRatingsAlignmentTest' --stacktrace
      - name: Prepare Android TV device tests
        working-directory: launcher
        run: |
          sudo chmod a+rw /dev/kvm
          ./gradlew --console=plain -PpetalixTvTest=true -Pdebuggable=true :app:assembleFullDebug :app:assembleFullDebugAndroidTest --stacktrace
          ./gradlew --stop
      - name: Verify the remote, categories and playlist matching on Android TV
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash tooling/petalix-glass/verify-tv.sh
      - name: Preserve test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guide-verification-diagnostics
          path: |
            verification/
            launcher/app/build/test-results/testFullDebugUnitTest/
            out/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble the verified owner APK
        working-directory: launcher
        run: ./gradlew --console=plain :app:assembleFullDebug --stacktrace
      - name: Verify TV installation identity and both ARM architectures
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          python3 - <<'PYVERIFY'
          import json, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('launcher/app/build/outputs/apk/full/debug')
          metadata = json.loads((root / 'output-metadata.json').read_text())
          matches = [item for item in metadata['elements'] if not item.get('filters')]
          assert len(matches) == 1, metadata['elements']
          apk = root / matches[0]['outputFile']
          sdk = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          info = subprocess.check_output([sdk / 'aapt', 'dump', 'badging', apk], text=True)
          signature = subprocess.check_output([sdk / 'apksigner', 'verify', '--verbose', '--print-certs', apk], text=True)
          version = int(os.environ['VERSION'])
          assert version > 1795087269
          assert f"name='com.petalix.iptv.hometest' versionCode='{version}'" in info.splitlines()[0], info.splitlines()[0]
          assert 'leanback-launchable-activity:' in info or 'android.software.leanback' in info
          import zipfile
          with zipfile.ZipFile(apk) as z:
              for abi in ('armeabi-v7a', 'arm64-v8a'):
                  assert any(p.startswith(f'lib/{abi}/') for p in z.namelist()), abi
          certificate = re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)', signature)
          assert certificate and certificate[1] == 'e2c9a67239c6297fb28a28b72a088ad32cff8aeb94e0157b02d22ee7aeb5cbd8'
          pathlib.Path('out/package.txt').write_text(info.splitlines()[0] + '\n' + certificate[0] + '\n')
          shutil.copy2(apk, 'out/Petalix-Guide-Owner-Test.apk')
          PYVERIFY
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          python3 launcher/vpn-android/ci/package-openvpn2-sources.py --output out/openvpn2-corresponding-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: petalix-glass-owner-test
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish isolated test download only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh release create "petalix-glass-owner-$GITHUB_RUN_ID" out/* --target "$GITHUB_SHA" --prerelease --latest=false --title "Petalix Guide · Owner Test $VERSION" --notes "Manual install over Petalix Home Test 1795087269. Live TV tiles open the smoky guide. Press Left for Sports Hub, My Locals, Favorites and Recently Watched. Sports adds official clips for supported games and Multiview filters. Movies and episodes keep playback position when switching sources, with fallback for automatic episode playback. The screenshots show the guide on an Android TV emulator with sample listings."
