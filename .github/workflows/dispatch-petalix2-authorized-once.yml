# Distinct service experiences plus visible motion and audio, source 4cfedfa013721eb41648565a17227495b626d4ae
name: Request Petalix-only signed test APK
on:
  push:
    branches: [fix/petalix2-authorized-pipeline]
    paths: [.github/workflows/dispatch-petalix2-authorized-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request fresh authorized Petalix-only test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "camosclem/STCC-PETALIX-Builds"
          gh workflow run panel-build.yml --repo "$GITHUB_REPOSITORY" --ref main -f rebuild_build=a169ba3b-3792-473a-8b3a-b0ade721fdd9 -f ui2_test=true -f petalix_only=true
