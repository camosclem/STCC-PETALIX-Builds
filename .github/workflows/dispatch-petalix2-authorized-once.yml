name: Stage BetterPosters and Sports Hub customer update
on:
  push:
    branches: [fix/petalix2-authorized-pipeline]
    paths: [.github/workflows/dispatch-petalix2-authorized-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request signed customer candidate for panel selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run panel-build.yml --repo "$GITHUB_REPOSITORY" --ref main -f rebuild_build=a169ba3b-3792-473a-8b3a-b0ade721fdd9 -f glass_candidate=true -f petalix_only=true
