# Retry finished Petalix guide after cancelled panel job cleanup, source 0ebf37ebbdb369b60aa3706dd00f04c3e8bd6f98
name: Request Petalix-only signed test APK
on:
  push:
    branches: [fix/petalix2-authorized-pipeline]
    paths: [.github/workflows/dispatch-petalix2-authorized-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request fresh authorized Petalix-only test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "camosclem/STCC-PETALIX-Builds"
          gh workflow run panel-build.yml --repo "$GITHUB_REPOSITORY" --ref test/petalix-locals-guide-v11 -f rebuild_build=713685c5-46f6-4d53-8cc2-2466e8059141 -f ui2_test=true -f petalix_only=true
