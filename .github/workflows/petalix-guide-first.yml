name: Petalix Guide Android test
on:
  push:
    branches: [dev/guide-first-android]
    paths: [guide-first/**, .github/workflows/petalix-guide-first.yml]
  workflow_dispatch:

concurrency:
  group: petalix-guide-first-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android test APK
        working-directory: guide-first
        run: |
          ./gradlew --no-daemon --console=plain assembleDebug lintDebug || {
            find build -name lint-results-debug.txt -exec cat {} +
            exit 1
          }
      - name: Verify APK package and signature
        run: |
          cp guide-first/build/outputs/apk/debug/*-debug.apk Petalix-TV-Preview.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose Petalix-TV-Preview.apk
          "$BUILD_TOOLS/aapt" dump badging Petalix-TV-Preview.apk > badging.txt
          grep -F "package: name='com.petalix.guidereview'" badging.txt
          grep -F "leanback-launchable-activity:" badging.txt
          sha256sum Petalix-TV-Preview.apk > SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "petalix-guide-test-$GITHUB_RUN_ID" Petalix-TV-Preview.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "Petalix TV Preview" \
            --notes "Full-screen program guide, sports and streaming service tiles. Sample listings open immediately. Sign in with a separate Petalix Control preview PIN to load the assigned lineup and listings. Independent Android package com.petalix.guidereview."
