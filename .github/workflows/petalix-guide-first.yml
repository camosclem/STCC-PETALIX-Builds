name: Petalix Guide Android test
on:
  push:
    branches: [dev/guide-first-android]
    paths: [guide-first/**, .github/workflows/petalix-guide-first.yml]
  workflow_dispatch:

concurrency:
  group: petalix-guide-first-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android test APK
        working-directory: guide-first
        run: ./gradlew --no-daemon --console=plain lintDebug assembleDebug
      - name: Verify APK package and signature
        run: |
          cp guide-first/build/outputs/apk/debug/*-debug.apk Petalix-Guide-Test.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose Petalix-Guide-Test.apk
          "$BUILD_TOOLS/aapt" dump badging Petalix-Guide-Test.apk > badging.txt
          grep -F "package: name='com.petalix.guidefirst'" badging.txt
          grep -F "leanback-launchable-activity:" badging.txt
          sha256sum Petalix-Guide-Test.apk > SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "petalix-guide-test-$GITHUB_RUN_ID" Petalix-Guide-Test.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "Petalix Guide Android Test" \
            --notes "Standalone Android TV guide prototype. Import an M3U playlist and XMLTV listings. OK previews a channel and a second press opens full screen. Debug-signed test package com.petalix.guidefirst."
