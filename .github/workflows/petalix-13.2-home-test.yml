name: Petalix 1.2 complete Home and guide test
on:
  push:
    branches: [test/petalix-13.2-home]
    paths: [.github/workflows/petalix-13.2-home-test.yml, tooling/petalix-stock/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: petalix-13.2-home-test
  cancel-in-progress: true
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned public launcher source
        run: |
          git clone --no-recurse-submodules --depth 1 --branch 1.1.0-beta.13.2 https://github.com/homelessbrian/NuvioPlusIPTV.git launcher
          test "$(git -C launcher rev-parse HEAD)" = '6e18ff250d93c0c1bac64bda75f49b035027ab99'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Android SDK and branding tools
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Verify offline service artwork
        run: python3 -m unittest discover -s tooling/petalix-stock -p 'test_service_artwork.py' -q
      - name: Prepare Petalix on pinned Nuvio 1.2.0-beta.1.4
        id: prepare
        run: |
          VERSION=$(date +%s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 tooling/petalix-stock/prepare.py --upstream launcher --version "$VERSION" --owner-test
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > launcher/local.properties
          cp launcher/keystore/livetv-fork.jks "$RUNNER_TEMP/petalix-launcher-test.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/petalix-launcher-test.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"
      - name: Compile, test bridge and assemble isolated signed APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testFullDebugUnitTest --tests 'com.nuvio.tv.petalix.*' --tests 'com.nuvio.tv.ui.screens.home.PetalixCategoryHeroTest' :app:assembleFullDebug --stacktrace --parallel
      - name: Verify test identity and package
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          mkdir -p out
          APK=$(find launcher/app/build/outputs/apk/full/debug -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -1 | tee out/package.txt
          grep -F "name='com.petalix.iptv.hometest'" out/package.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > out/signature.txt
          cp "$APK" "out/Petalix-1.2-Home-Test-$VERSION.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          python3 launcher/vpn-android/ci/package-openvpn2-sources.py --output out/openvpn2-corresponding-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: petalix-13.2-home-test
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish isolated test download only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh release create "petalix-13.2-home-test-$VERSION" out/* --target "$GITHUB_SHA" --prerelease --latest=false --title "Petalix 1.2 Home Test $VERSION" --notes "Petalix test based on Homeless Brian 1.2.0-beta.1.4. Full-card service motion, cleaner Home text, improved channel-logo matching, A-Z guide sorting, streaming grouping, measured-bitrate guide copies with retained backups, Netflix-style playback settings and Quiet Commercials PCM compression. Focused Live TV category updates its backdrop and clears stale service artwork, title and trailers. Modern ZIP setup with station previews and one Locals group; favorites backup and restore stay on the panel. Isolated package com.petalix.iptv.hometest: does not replace the customer app or change the live panel. Activate with your existing PIN. Not a TV launcher. Customer release requires device testing and the existing customer signing workflow; no customer rollout is queued."
