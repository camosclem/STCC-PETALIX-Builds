<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petalix Remote Guide</title></head><body style="margin:0;background:#131415;color-scheme:dark">
<div id="petalix-remote-guide">
<style>
#petalix-remote-guide{color-scheme:dark;box-sizing:border-box;background:#131415;color:#f9f5ef;padding:clamp(16px,3.5vw,44px);font:16px/1.4 "DM Sans",Arial,sans-serif}
#petalix-remote-guide *{box-sizing:border-box}
#petalix-remote-guide button{font:inherit;color:inherit;cursor:pointer}
#petalix-remote-guide header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #343535;padding-bottom:16px}
#petalix-remote-guide header strong{font-size:16px;letter-spacing:.15em;color:#e8c480}
#petalix-remote-guide header span{color:#c7c4be;font-size:14px}
#petalix-remote-guide .body{display:grid;grid-template-columns:minmax(145px,.83fr) minmax(210px,1.17fr);align-items:start;gap:clamp(16px,4vw,48px);max-width:1024px;margin:22px auto 0}
#petalix-remote-guide .stage{display:grid;place-items:center;background:radial-gradient(ellipse at 47% 35%,#393836,#232424 52%,#1a1b1c 92%);border-radius:13px;padding:18px 8px}
#petalix-remote-guide .device{position:relative;line-height:0}
#petalix-remote-guide .device img{display:block;height:clamp(335px,53vw,465px);width:auto;max-width:100%;filter:drop-shadow(6px 8px 9px #080909)}
#petalix-remote-guide .hot{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;background:none;padding:0}
#petalix-remote-guide .hot[aria-pressed=true],#petalix-remote-guide .hot:focus-visible{background:#f5c56652;outline:3px solid #efbd62;box-shadow:0 0 0 2px #282018}
#petalix-remote-guide .hot:hover{outline:2px solid #efbd62}
#petalix-remote-guide h2{margin:0 0 5px;color:#fff9ed;font-size:clamp(26px,4vw,43px);letter-spacing:-.045em;line-height:1.12}
#petalix-remote-guide .hint{font-size:15px;color:#c9c6c2;margin:0 0 17px}
#petalix-remote-guide .controls{display:flex;gap:6px;flex-wrap:wrap}
#petalix-remote-guide .action{border:1px solid #515251;padding:7px 12px;border-radius:20px;background:#212223;line-height:1.2}
#petalix-remote-guide .action[aria-pressed=true]{color:#171715;background:#ebcd93;border-color:#ebcd93}
#petalix-remote-guide .action:focus-visible,#petalix-remote-guide .reference button:focus-visible{outline:3px solid #e9bf6e;outline-offset:2px}
#petalix-remote-guide .detail{margin:20px 0 14px;padding:17px 0;border-top:1px solid #41403e;border-bottom:1px solid #41403e}
#petalix-remote-guide h3{font-size:25px;margin:0;color:#f4d59a}
#petalix-remote-guide dl{margin:10px 0 0}#petalix-remote-guide dt{font-weight:bold;margin-top:10px}#petalix-remote-guide dd{margin:2px 0 0;color:#d6d4cf}
#petalix-remote-guide .reference{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
#petalix-remote-guide .reference button{border:0;border-bottom:1px solid #6a6862;padding:5px 7px;background:transparent}
#petalix-remote-guide .reference button[aria-pressed=true]{color:#f4d59a;border-color:#e2b65e}
#petalix-remote-guide [hidden]{display:none!important}
#petalix-remote-guide .status{font-size:14px;color:#e8c480;margin:10px 0 0}
@media(max-width:540px){#petalix-remote-guide .body{grid-template-columns:86px minmax(0,1fr);gap:12px}#petalix-remote-guide .stage{padding:10px 4px}#petalix-remote-guide .device img{height:auto;width:100%}#petalix-remote-guide .detail{margin:12px 0;padding:10px 0}#petalix-remote-guide .action{font-size:14px;padding:7px 9px}#petalix-remote-guide .reference button{min-height:42px}}
@media(min-width:541px) and (max-height:650px){#petalix-remote-guide .device img{height:min(78vh,465px)}#petalix-remote-guide .stage{padding:9px}#petalix-remote-guide{padding:16px 30px}#petalix-remote-guide .body{margin-top:12px}}
</style>

const layouts={

const book={
 left:['Left','At the current listing, tap Left for categories. Hold Left to browse earlier listings on catch-up channels.','On live TV, open categories or the channel overlay. During catch-up, seek backward.'],
 right:['Right','From categories, return to channels. In the grid, move forward through the schedule.','Tap to show channel info. Tap twice for backup streams, or hold to return to the last channel. During catch-up, seek forward.'],
 up:['Up','Move up one channel. At the first channel, press Up to reach Guide options.','With controls closed, go to the next channel. Channel Surf mode lets you browse before tuning.'],
 down:['Down','Move down one channel or category.','With controls closed, go to the previous channel, or browse it in Channel Surf mode.'],
 ok:['OK / Select','Select a category or listing. On a live channel, OK starts preview and a second OK opens full screen. With preview off or direct full screen enabled, one press opens it. Hold OK for channel options.','Show playback controls. Hold OK for player options.'],
 back:['Back','From another time, return to now. From the current listing, open categories. From categories, open the Petalix menu.','Close the open controls. From full screen, return to the screen you came from.'],
 chUp:['Channel +','Jump up eight channels in the grid.','Go to the next channel, or browse it when Channel Surf is on.'],
 chDown:['Channel −','Jump down eight channels in the grid.','Go to the previous channel, or browse it when Channel Surf is on.'],
 ff:['Fast-forward','Move forward four guide steps.','Use the playback timeline to seek forward when a recording, replay, or live buffer supports it.'],
 rew:['Rewind','Move backward four guide steps where earlier listings are available.','Use the playback timeline to seek backward when a recording, replay, or live buffer supports it.'],
 play:['Play / pause','Open the channel already playing in the preview in full screen.','Pause or resume when the stream supports it.'],
 power:['Power','Puts the streamer to sleep or wakes it. TV power depends on your device setup.'],
 home:['Home','Opens the streaming device’s Home screen.'],
 input:['TV input','Changes the TV input when the onn. remote is configured to control your TV.'],
 profile:['Profile','Opens the Google TV profile selector.'],
 settings:['Settings','Opens device settings. On SHIELD this button can be remapped. If your remote sends Menu to Petalix, it opens channel options in the guide or player options during live TV.'],
 voice:['Voice','Starts voice search through the device’s voice assistant.'],
 live:['Live TV','Opens the device’s live-TV destination. For the Petalix guide, choose Live TV inside Petalix.'],
 volUp:['Volume +','Raises the volume on your configured TV, receiver, or streamer.'],
 volDown:['Volume −','Lowers the volume on your configured TV, receiver, or streamer.'],
 mute:['Mute','Silences or restores audio on the configured device.'],
 youtube:['YouTube','Launches YouTube from the device.'],netflix:['Netflix','Launches Netflix from the device.'],
 disney:['Disney+','Launches Disney+ from the device.'],paramount:['Paramount+','Launches Paramount+ from the device.']
};
let model='onn', selected='left', practice=false;
const button=(text,cls,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=fn;return b;};
function select(id){
 selected=id;const [name,a,b]=book[id];
 q('h3').textContent=name;const dl=q('dl');dl.replaceChildren();
 const lines=b?[['In the guide',a],['Watching live TV',b]]:[['Device control',a]];
 for(const [title,desc] of lines){const t=document.createElement('dt'),d=document.createElement('dd');t.textContent=title;d.textContent=desc;dl.append(t,d);}
 all('[data-key]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.key===id)));
}
function draw(m){
 model=m;const img=q('img');img.src=images[m];img.alt=m==='onn'?'onn. 4K Google TV remote, 2023':'NVIDIA SHIELD triangular remote, 2019';
 q('.buttons').replaceChildren();q('.reference').replaceChildren();
 for(const [id,x,y,w,h] of layouts[m]){
   const name=book[id][0],hot=button('','hot',()=>select(id)),ref=button(name,'',()=>select(id));
   hot.setAttribute('aria-label',name);hot.dataset.key=ref.dataset.key=id;
   Object.assign(hot.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});
   q('.buttons').append(hot);q('.reference').append(ref);
 }
 all('[data-model]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.model===m)));
 select(layouts[m].some(k=>k[0]===selected)?selected:'left');
}
function setPractice(on){practice=on;const b=q('[data-action=practice]');b.setAttribute('aria-pressed',String(on));b.textContent=on?'End practice':'Practice';
 q('.status').textContent=on?'Try arrows, OK, or a playback button. Back ends practice. Select system shortcuts on the picture.':'';}
all('[data-model]').forEach(b=>b.onclick=()=>{setPractice(false);draw(b.dataset.model);});
q('[data-action=practice]').onclick=()=>setPractice(!practice);
q('[data-action=guide]').onclick=()=>{const r=q('.reference');r.hidden=!r.hidden;q('[data-action=guide]').setAttribute('aria-expanded',String(!r.hidden));};
function move(dir){
 const visible=all('button').filter(b=>b.offsetWidth&&b.offsetHeight);
 const a=document.activeElement;
 if(!visible.includes(a)){q('[data-model="'+model+'"]').focus();return;}
 const center=b=>{const r=b.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
 const [ax,ay]=center(a),horizontal=dir==='left'||dir==='right',sign=dir==='up'||dir==='left'?-1:1;
 let best=null,lowest=Infinity;
 visible.forEach(b=>{if(a===b)return;const [x,y]=center(b),d=(horizontal?x-ax:y-ay)*sign,c=Math.abs(horizontal?y-ay:x-ax);
  if(d<3)return;const score=d+3*c+2*c*c/d;if(score<lowest){lowest=score;best=b;}});
 if(best)best.focus();
}
function input(id){
 if(id==='back'){if(practice){select('back');setPractice(false);return true;}if(!q('.reference').hidden){q('[data-action=guide]').click();q('[data-action=guide]').focus();return true;}return false;}
 if(practice){if(layouts[model].some(row=>row[0]===id))select(id);return true;}
 if(['left','right','up','down'].includes(id)){move(id);return true;}
 if(id==='ok'){if(root.contains(document.activeElement)&&document.activeElement.tagName==='BUTTON')document.activeElement.click();else q('[data-model="'+model+'"]').focus();return true;}
 if(layouts[model].some(row=>row[0]===id)){select(id);return true;}return false;
}
const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Escape:'back',Backspace:'back',Enter:'ok',MediaPlayPause:'play',MediaFastForward:'ff',MediaRewind:'rew',ChannelUp:'chUp',ChannelDown:'chDown'};
root.addEventListener('keydown',e=>{const id=keys[e.key];if(id&&input(id))e.preventDefault();});
window.petalixTutorialInput=input;
window.petalixTutorialStart=m=>{
 if(m==='shield'||m==='onn')draw(m);
 q('[data-model="'+model+'"]').focus();
};
draw(model);
q('[data-model="'+model+'"]').focus();
})();
