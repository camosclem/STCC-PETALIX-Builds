<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a11"><title>Petalix TV</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<header class="topbar"><button id="menu-button" class="icon-button" aria-label="Menu">☰</button><div class="topbrand"><img src="petalix-wordmark.png" alt="Petalix"></div><nav id="topnav" aria-label="Main navigation"></nav><div class="topend"><label class="searchbox"><span>⌕</span><input id="search" placeholder="Search" autocomplete="off"><kbd>⌕</kbd></label><button class="icon-button small" id="settings-shortcut" aria-label="Settings">⚙</button><button class="profile-button" id="profile-button" aria-label="Profile">P</button></div></header>
<div class="mainarea"><aside id="drawer" class="drawer" aria-label="Categories"><div class="drawer-header"><img src="petalix-wordmark.png" alt="Petalix TV"></div><nav id="drawer-nav"></nav><div id="drawer-groups"></div></aside><div id="scrim" class="scrim" hidden></div><main id="viewport" tabindex="-1"><div id="screen"></div></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="details" class="details-backdrop hidden" role="dialog" aria-modal="true"><div class="details-panel"><button id="details-close" class="icon-button details-close">✕</button><div id="details-body"></div></div></div>
<input type="file" id="playlist-file" accept=".m3u,.m3u8,.txt,text/plain" hidden>
<script src="logic.js"></script><script src="app.js"></script></div></body></html>
