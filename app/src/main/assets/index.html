  <script>
(function (root) {
  'use strict';
  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(36);
  }
  function attrs(s) {
    const result = {};
    const exp = /([\w-]+)\s*=\s*(["'])(.*?)\2/g;
    let item;
    while ((item = exp.exec(s))) result[item[1].toLowerCase()] = item[3];
    return result;
  }
  function parseM3U(content, source) {
    const lines = String(content).replace(/^\uFEFF/, '').split(/\r?\n/);
    if (!lines.some(x => x.trim().startsWith('#EXTINF'))) {
      if (lines.some(x => x.includes('#EXT-X-'))) throw Error('This is an HLS stream manifest, not a channel playlist. Add an M3U channel list.');
      throw Error('No #EXTINF channel entries found in this playlist.');
    }
    const channels = [];
    let info = null, group = '';
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith('#EXTGRP:')) { group = line.slice(8).trim(); if (info && info.group === 'Other') info.group = group; continue; }
      if (line.startsWith('#EXTINF:')) {
        const comma = line.indexOf(',');
        const left = comma < 0 ? line : line.slice(0, comma);
        const meta = attrs(left);
        info = {
          name: (comma < 0 ? meta['tvg-name'] : line.slice(comma + 1).trim()) || meta['tvg-name'] || 'Untitled channel',
          tvgId: meta['tvg-id'] || '',
          logo: meta['tvg-logo'] || '',
          group: meta['group-title'] || group || 'Other',
          number: meta['tvg-chno'] || meta['channel-number'] || '',
        };
        continue;
      }
      if (line.startsWith('#')) continue;
      if (info && /^(https?:\/\/|rtsp:\/\/)/i.test(line)) {
        const key = `${source}|${info.tvgId || info.name}|${line}`;
        channels.push({ ...info, id: hash(key), url: line, source });
        info = null;
        group = '';
      }
    }
    if (!channels.length) throw Error('No playable HTTP, HTTPS or RTSP channel URLs found.');
    return channels;
  }
  function isSports(c) {
    const s = (c.group + ' ' + c.name).toLowerCase();
    return /sports?|espn|fox sports|fanduel|tsn|nba|nfl|nhl|mlb|soccer|football|ufc|premier league|sec network|acc network|sky sport|bein|tennis|racing/.test(s);
  }
  function isLocal(c) {
    const g = (c.group || '').toLowerCase();
    const n = (c.name || '').toLowerCase();
    return /locals?|broadcast|over.the.air|affiliates?|city stations?/.test(g) ||
      /\b(abc|cbs|nbc|fox|pbs|cw|mytv)\s*(?:\d{1,2}|\w{3,5}\b)|\b(?:wbtv|wcnc|wsoc|wccb|wlos|wspa|wltx)\b/.test(n);
  }
  function parseXmlTvDate(raw) {
    if (!raw) return null;
    const match = raw.trim().match(/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?\s*([+-])(\d\d)(\d\d)/);
    if (!match) return null;
    const [,y,m,d,h,min,sec,sign,tzh,tzm] = match;
    const base = Date.UTC(+y,+m - 1,+d,+h,+min,+(sec || 0));
    const offsetMs = (+tzh * 60 + +tzm) * 60 * 1000 * (sign === '+' ? 1 : -1);
    return new Date(base - offsetMs);
  }
  const exported = { parseM3U, isSports, isLocal, parseXmlTvDate, hash };
  if (typeof module !== 'undefined' && module.exports) module.exports = exported;
  root.OpenGuide = exported;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  function render() {
    const tab=tabs.includes(state.tab)?state.tab:'Home';
    $('page-title').textContent=tab;
    document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.target===tab));
    const status=$('source-status');status.textContent=hasReal()?`${state.channels.length.toLocaleString()} channels ready`:'No source connected';
    document.querySelector('.status-dot').classList.toggle('online',hasReal());
    const content=$('content');
    content.innerHTML=tab==='Home'?home():tab==='Settings'?settings():tab==='Guide'?guide():tab==='My Locals'?locals():library(tab);
  }
  function navigate(tab) {
    if(!tabs.includes(tab))return;
    state.tab=tab;state.category='All';
    render();$('content').scrollTop=0;
  }
  function handleBack() {
    if(!$('player-modal').classList.contains('hidden')) {closePlayer();return;}
    if(state.tab!=='Home')navigate('Home');else if(native)window.AndroidBridge.exitApp();
  }
  window.handleBack=handleBack;
  function setPlaylist(content,name,url) {
    try {
      const parsed=L.parseM3U(content,name);
      const existing=state.sources.find(s=>s.name===name);
      const id=existing?existing.id:L.hash(`${Date.now()}|${name}`);
      if(!existing)state.sources.push({id,name,url:url||'',kind:url?'url':'file'});
      state.channels=state.channels.filter(c=>c.source!==name).concat(parsed);
      state.firstRun=false; persist();navigate('Live TV');
      notify(`${parsed.length.toLocaleString()} channels loaded from ${name}.`);
    } catch(e) {notify(e.message||'Could not parse M3U playlist');}
  }
  window.onNativePlaylist=function(content,name) {
    const entry=state.sources.find(s=>s.name===name);
    const url=pendingUrls.get(name) || (entry?entry.url:'');
    pendingUrls.delete(name);
    setPlaylist(content,name,url);
  };
  window.onNativeError=function(message) {notify('Import failed: '+message);};
  window.onNativeEpg=function(content) {loadXmlTv(content);};
  function importUrl(url,name) {
    if(!/^https?:\/\//i.test(url)) {notify('Enter a valid http:// or https:// M3U URL.');return;}
    if(native) {pendingUrls.set(name,url);window.AndroidBridge.importPlaylist(url,name);notify('Loading '+name+'…');return;}
    fetch(url).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.text();})
      .then(txt=>setPlaylist(txt,name,url))
      .catch(e=>notify('Browser blocked this source ('+e.message+'). Android app imports without browser CORS restrictions.'));

  function refreshSources() {
    const urls=state.sources.filter(s=>s.kind==='url' && s.url);

    urls.forEach(s=>importUrl(s.url,s.name));

  function loadEpgUrl() {
    const url=$('epg-url')?.value.trim() || state.epgUrl;
    if(!/^https?:\/\//i.test(url)) {notify('Enter a valid XMLTV URL.');return;}
    state.epgUrl=url; persist();
    if(native){window.AndroidBridge.importEpg(url);notify('Downloading XMLTV guide…');return;}
    fetch(url).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.text();}).then(loadXmlTv)
      .catch(e=>notify('Browser could not load the EPG: '+e.message));
  }
  function loadXmlTv(content) {
    try {
      const parsed=new DOMParser().parseFromString(content,'application/xml');
      if(parsed.querySelector('parsererror'))throw Error('Invalid XMLTV document');
      const epg={};const names={};
      parsed.querySelectorAll('channel').forEach(node=>{
        const id=(node.getAttribute('id')||'').toLowerCase();
        const display=node.querySelector('display-name');
        if(display){const name=display.textContent.trim().toLowerCase();if(name&&id)names[id]=name;}
      });
      const programs=parsed.querySelectorAll('programme');
      const limit=Math.min(programs.length,300000);
      const max=Date.now()+8*24*60*60*1000,min=Date.now()-12*60*60*1000;
      for(let i=0;i<limit;i++){
        const p=programs[i];
        const ch=(p.getAttribute('channel')||'').toLowerCase();
        const start=L.parseXmlTvDate(p.getAttribute('start'));
        const stop=L.parseXmlTvDate(p.getAttribute('stop'));
        if(!ch||!start||!stop||stop.getTime()<min||start.getTime()>max)continue;
        const title=p.querySelector('title')?.textContent || 'Program';
        const obj={title,start:start.getTime(),stop:stop.getTime()};
        (epg[ch]||=([])).push(obj);
        if(names[ch]) (epg[names[ch]]||=([])).push(obj);
      }
      Object.values(epg).forEach(arr=>arr.sort((a,b)=>a.start-b.start));
      state.epg=epg;
      render();notify(`Guide loaded: ${Object.keys(epg).length} channels mapped.`);
    } catch(e){notify('Could not parse XMLTV: '+e.message);}
  }
  function channelById(id) {return list().find(c=>c.id===id);}

  document.addEventListener('click',e=>{

  let pressTimer=null,pressLong=false;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'||e.key==='Backspace' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){
      e.preventDefault();handleBack();return;
    }
    const c=document.activeElement?.closest('[data-channel]');
    if(c && (e.key==='Enter'||e.key===' ')){
      if(e.repeat){e.preventDefault();return;}
      pressLong=false;
      clearTimeout(pressTimer);
      pressTimer=setTimeout(()=>{pressLong=true;toggleFavorite(c.dataset.channel);},660);
      e.preventDefault();return;
    }
    if(e.key.startsWith('Arrow')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){
      const elements=Array.from(document.querySelectorAll('button:not([disabled]),input:not([type=hidden])')).filter(el=>el.offsetParent!==null);
      const active=document.activeElement;
      const current=active.getBoundingClientRect();
      if(!elements.includes(active)){elements[0]?.focus();e.preventDefault();return;}
      const cx=current.left+current.width/2,cy=current.top+current.height/2;
      const matches=elements.filter(el=>el!==active).map(el=>{
        const r=el.getBoundingClientRect(),x=r.left+r.width/2-cx,y=r.top+r.height/2-cy;
        const valid=e.key==='ArrowRight'?x>2:e.key==='ArrowLeft'?x< -2:e.key==='ArrowDown'?y>2:y< -2;
        if(!valid)return null;
        const forward=e.key==='ArrowRight'||e.key==='ArrowLeft'?Math.abs(x):Math.abs(y);
        const cross=e.key==='ArrowRight'||e.key==='ArrowLeft'?Math.abs(y):Math.abs(x);
        return {el,score:forward+cross*2.8};
      }).filter(Boolean).sort((a,b)=>a.score-b.score);
      if(matches.length){matches[0].el.focus();matches[0].el.scrollIntoView({block:'nearest',inline:'nearest'});e.preventDefault();}
    }
  });
  document.addEventListener('keyup',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    if(pressTimer!==null){clearTimeout(pressTimer);pressTimer=null;
      const c=document.activeElement?.closest('[data-channel]');
      if(c){e.preventDefault();if(!pressLong)openPlayer(c.dataset.channel);}
    }
  });
  $('search').addEventListener('input',e=>{
    const el=e.target,pos=el.selectionStart;
    state.search=el.value;render();el.focus();el.setSelectionRange(pos,pos);
  });
  $('playlist-file').addEventListener('change',e=>{
    const file=e.target.files?.[0];if(!file)return;
    file.text().then(text=>setPlaylist(text,file.name,'')).catch(err=>notify('File import failed: '+err.message));
    e.target.value='';
  });
  setInterval(setClock,30000);
  readState();setClock();render();
  // Native HTTP bridge eliminates browser CORS restrictions when installed as an Android APK.
  if(native&&state.sources.some(s=>s.kind==='url'&&s.url)){
    setTimeout(()=>refreshSources(),1400);
  }
  if(native&&state.epgUrl)setTimeout(()=>window.AndroidBridge.importEpg(state.epgUrl),2400);
})();

</script>
</body>
</html>
